name: IndexNow ping
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages deploy
        run: sleep 90
      - name: Notify IndexNow
        run: |
          # URLs come from the committed sitemap, not a hardcoded list that
          # silently goes stale. Read the checkout rather than the live file:
          # the Pages CDN caches for ~10 minutes, so a fetch this soon after a
          # push often still serves the previous version.
          URLS=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$URLS" | jq 'length') URLs"
          BODY=$(jq -nc \
            --arg h "hawaiirentaltax.com" \
            --arg k "6c50960d2e327ed484080666e55eed19" \
            --argjson u "$URLS" \
            '{host: $h, key: $k, keyLocation: ("https://" + $h + "/" + $k + ".txt"), urlList: $u}')
          curl -s -o /dev/null -w "IndexNow responded %{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY"
